<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Study</title>
    <style>
      /* This css will also apply to before and after pseudo-elements. Before and after pseudo-elements are special elements that are inserted before or after the content of an element. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      .box {
        width: 100px;
        height: 100px;

        background: radial-gradient(circle, red, blue);
      }

      .flexbox {
        display: flex;
        height: 100px;
        background-color: red;
        flex-direction: row;
        align-items: center;
        justify-content: space-evenly;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }

      .card {
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <center>
      <h1>
        In This Exercise I View only those Things of CSS which I don't know
      </h1>
    </center>
    <img src="images/7g.jpg" alt="A cute cat" />
    <div class="box"></div>

    <div class="flexbox"><span>Hello</span> <span>World</span></div>

    <br />
    <br />

    <div class="gallery">
      <div class="card">Card 1</div>
      <div class="card">Card 2</div>
      <div class="card">Card 3</div>
      <div class="card">Card 4</div>
      <div class="card">Card 5</div>
      <div class="card">Card 6</div>
    </div>
  </body>
</html>
